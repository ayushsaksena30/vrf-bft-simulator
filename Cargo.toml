[package]
name = "vrf-bft-simulator"
version = "0.1.3"
edition = "2024"

[lib]
crate-type = ["cdylib","rlib"]

[dependencies]
ed25519-dalek = {version="2", features = ["rand_core"]}
rand = {version="0.8"}
hex = {version="0.4"}
sha2 = {version="0.11"}
hmac = {version="0.13.0"}
wasm-bindgen = "0.2"
serde = {version = "1.0", features=["derive"]}
serde-wasm-bindgen = "0.6"
getrandom = {version="0.2", features =["js"]}